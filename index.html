<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Page Not Found">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="error-container" role="main">
    <!-- Illustration / Icon Section -->
    <div class="illustration-wrapper" aria-hidden="true">
      <svg class="floating-illustration" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background decorative elements / stars -->
        <circle cx="50" cy="40" r="3" fill="#A5B4FC" class="star star-1" />
        <circle cx="280" cy="50" r="4" fill="#C7D2FE" class="star star-2" />
        <circle cx="30" cy="160" r="2.5" fill="#E0E7FF" class="star star-3" />
        <circle cx="290" cy="170" r="3" fill="#A5B4FC" class="star star-4" />
        <path d="M70 110L73 117L80 120L73 123L70 130L67 123L60 120L67 117L70 110Z" fill="#FDE047" opacity="0.8" class="twinkle" />
        <path d="M250 100L252 105L257 107L252 109L250 114L248 109L243 107L248 105L250 100Z" fill="#FDE047" opacity="0.7" class="twinkle" />

        <!-- Friendly Planet -->
        <circle cx="160" cy="115" r="55" fill="url(#planet-grad)" />
        <!-- Planet Ring -->
        <ellipse cx="160" cy="115" rx="90" ry="22" stroke="url(#ring-grad)" stroke-width="8" stroke-linecap="round" transform="rotate(-18 160 115)" />
        
        <!-- Friendly Face on Planet -->
        <!-- Eyes -->
        <circle cx="145" cy="112" r="5" fill="#1E1B4B" />
        <circle cx="175" cy="112" r="5" fill="#1E1B4B" />
        <!-- Eye highlights -->
        <circle cx="147" cy="110" r="1.8" fill="#FFFFFF" />
        <circle cx="177" cy="110" r="1.8" fill="#FFFFFF" />
        <!-- Blush -->
        <circle cx="137" cy="120" r="6" fill="#FDA4AF" opacity="0.6" />
        <circle cx="183" cy="120" r="6" fill="#FDA4AF" opacity="0.6" />
        <!-- Friendly Smile -->
        <path d="M153 122C155 126 165 126 167 122" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" fill="none" />

        <!-- Floating Little Satellite / Moon -->
        <g class="orbiting-moon">
          <circle cx="85" cy="65" r="14" fill="#E2E8F0" />
          <circle cx="81" cy="62" r="3" fill="#CBD5E1" />
          <circle cx="90" cy="70" r="2.5" fill="#CBD5E1" />
        </g>

        <!-- Gradients definition -->
        <defs>
          <linearGradient id="planet-grad" x1="120" y1="70" x2="200" y2="170" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818CF8" />
            <stop offset="1" stop-color="#4F46E5" />
          </linearGradient>
          <linearGradient id="ring-grad" x1="70" y1="115" x2="250" y2="115" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F472B6" />
            <stop offset="0.5" stop-color="#FDE047" />
            <stop offset="1" stop-color="#38BDF8" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Error Code Heading -->
    <h1 class="error-code">404</h1>

    <!-- Friendly Error Message -->
    <h2 class="error-title">Oops! Lost in Space</h2>
    <p class="error-description">
      The page you're looking for doesn't exist or has traveled to another galaxy. Don't worry, let's get you back home safe and sound!
    </p>

    <!-- Navigation / Action Button -->
    <div class="actions">
      <a href="/" class="btn-home">
        <svg class="home-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Back to Homepage</span>
      </a>
    </div>
  </main>
</body>
</html>
